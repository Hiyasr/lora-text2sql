[project]
name = "t2sql"
version = "0.1.0"
description = "LoRA fine-tuning, evaluation and serving of a small open model for text-to-SQL"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
train = ["torch", "transformers>=4.44", "peft>=0.12", "datasets", "accelerate", "sqlglot"]
serve = ["fastapi", "uvicorn"]
api = ["anthropic"]
dev = ["pytest", "sqlglot"]

[tool.setuptools]
packages = ["t2sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
